name: Continuous Deployment to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies & Build Web Bundle
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npx expo export --platform web

      - name: 🚀 Copy Code & Built Bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/,frontend/dist/,deploy/,package.json,.env.example"
          target: "/home/ubuntu/snippet-app"
          strip_components: 0
          rm: false

      - name: 🔄 Update Dependencies & Restart Service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/snippet-app"
            
            echo ">>> Installing Python requirements..."
            cd "$APP_DIR/backend"
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            venv/bin/pip install -e ./emergentintegrations 2>/dev/null || true

            echo ">>> Restarting MergeDeck systemd service..."
            sudo systemctl restart mergedeck
            sudo systemctl restart nginx
            
            echo ">>> Verifying health check..."
            sleep 2
            curl -s http://127.0.0.1/health || true
            echo "Deployment completed successfully!"
