[project]
name = "backend"
version = "0.1.0"
description = "CodeTok FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "motor",
    "pydantic-settings",
    "httpx",
    "PyJWT",
    "python-dotenv",
    "pytest>=9.0.2",
    "requests>=2.32.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
