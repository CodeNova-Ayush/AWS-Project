<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <title>Offline — MergeDeck</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    /* Subtle background grid and glow */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, rgba(124, 58, 237, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1;
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00D2FF;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.15);
    }
    .icon-container svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      font-size: 12px;
      font-weight: 600;
      color: #F87171;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #EF4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #00D2FF 0%, #0088FF 100%);
      color: #050505;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 210, 255, 0.25);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(0, 210, 255, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn.checking {
      opacity: 0.7;
      pointer-events: none;
    }
    .footnote {
      margin-top: 20px;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <!-- Wifi Off Icon -->
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">No Internet Connection</span>
    </div>

    <h1>You are currently offline</h1>
    <p>MergeDeck requires an active internet connection to stream pull request feeds, execute AI reviews, and sync actions with GitHub.</p>

    <button class="btn" id="retryBtn" onclick="checkConnection()">
      Try Reconnecting
    </button>

    <div class="footnote">
      The app will automatically resume when your connection returns.
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const statusText = document.getElementById('statusText');

    function checkConnection() {
      retryBtn.classList.add('checking');
      retryBtn.innerText = 'Checking connection...';

      fetch('/health', { method: 'GET', cache: 'no-store' })
        .then(response => {
          if (response.ok) {
            statusText.innerText = 'Connection restored!';
            window.location.reload();
          } else {
            throw new Error('Not reachable');
          }
        })
        .catch(() => {
          setTimeout(() => {
            retryBtn.classList.remove('checking');
            retryBtn.innerText = 'Try Reconnecting';
          }, 800);
        });
    }

    // Auto-reload as soon as internet connection is detected
    window.addEventListener('online', () => {
      statusText.innerText = 'Online detected! Reloading...';
      window.location.reload();
    });
  </script>
</body>
</html>
